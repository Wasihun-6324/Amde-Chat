<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amde-Chat | Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --fb-blue: #1877F2; --bg-gray: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg-gray); padding-bottom: 70px; }

        /* ተቀያያሪ ህብረ ቀለም (Animated Rainbow) */
        .brand-name {
            font-size: 55px; font-weight: 900; text-align: center; margin-top: 30px;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rainbow-move 5s linear infinite; letter-spacing: 4px;
        }
        @keyframes rainbow-move { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* የዛጉዌ ጥቅስ */
        .zagwe-quote {
            text-align: center; color: #1a3a5f; font-size: 19px; font-weight: 600;
            margin: 15px 30px; line-height: 1.6; border-left: 5px solid #d4af37; padding-left: 15px;
        }

        /* Navigation */
        nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { color: #65676b; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--fb-blue); border-bottom: 3px solid var(--fb-blue); padding-bottom: 5px; }

        /* Post Card */
        .page { display: none; width: 95%; max-width: 500px; margin: 20px auto; }
        .active-page { display: block; }
        .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .post-media { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 450px; object-fit: cover; }
        
        /* Interaction Buttons */
        .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px; }
        .action-btn { color: #65676b; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .action-btn.liked { color: var(--fb-blue); }

        /* Messenger Window */
        #chat-window { height: 350px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 10px; }
        .msg { margin: 5px; padding: 10px; border-radius: 15px; max-width: 75%; }
        .sent { background: var(--fb-blue); color: #fff; align-self: flex-end; margin-left: auto; }
        .recv { background: #e4e6eb; color: #000; }

        .btn-main { background: var(--fb-blue); color: white; border: none; padding: 12px; border-radius: 20px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-page">
    <div class="brand-name">AMDE-CHAT</div>
    <div class="zagwe-quote">" ትናንት በድንጋይ ላይ የታነጸው የዛጉዌ ጥበብ፤ ዛሬ በአምድ-ቻት በዲጂታል ዓለም ዳግም ይኖራል ! "</div>
    <div class="card" style="max-width:380px; margin: auto;">
        <input type="email" id="email" placeholder="Email" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
        <input type="password" id="password" placeholder="Password" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd;">
        <button onclick="handleAuth()" class="btn-main">ግባ / ተመዝገብ</button>
    </div>
</div>

<div id="main-app" style="display:none;">
    <header style="background:#fff; padding:10px; text-align:center; position:sticky; top:0; border-bottom:1px solid #ddd;">
        <span class="brand-name" style="font-size:25px; margin:0;">AMDE-CHAT</span>
    </header>

    <div id="home" class="page active-page">
        <div class="card">
            <textarea id="postTxt" placeholder="ምን አዲስ ነገር አለ?" style="width:100%; border:none; outline:none; font-size:16px;"></textarea>
            <input type="file" id="postFile" accept="image/*,video/*" style="margin-top:10px;">
            <button onclick="uploadPost()" class="btn-main" style="margin-top:10px;">Post</button>
        </div>
        <div id="feed-container"></div>
    </div>

    <div id="messenger" class="page">
        <div class="card">
            <input type="text" id="targetUser" placeholder="የጓደኛ ኢሜይል..." style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <div id="chat-window"></div>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="chatMsg" placeholder="መልዕክት..." style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd;">
                <button onclick="sendMsg()" class="btn-main" style="width:60px; border-radius:50%;"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="search" class="page">
        <div class="card"><input type="text" placeholder="ሰዎችን ፈልግ..." style="width:100%; padding:10px; border-radius:20px; border:1px solid #ddd;"></div>
    </div>

    <div id="video" class="page">
        <div id="video-container"></div>
    </div>

    <nav>
        <div class="nav-item active" onclick="showPage('home', this)"><i class="fa fa-home"></i></div>
        <div class="nav-item" onclick="showPage('messenger', this)"><i class="fa fa-comment-dots"></i></div>
        <div class="nav-item" onclick="showPage('video', this)"><i class="fa fa-play-circle"></i></div>
        <div class="nav-item" onclick="showPage('search', this)"><i class="fa fa-users"></i></div>
        <div class="nav-item" onclick="location.reload()"><i class="fa fa-sign-out-alt"></i></div>
    </nav>
</div>

<script>
    const supabaseUrl = 'https://kwrnjepvkqlvwljsjfvj.supabase.co';
    const supabaseKey = 'sb_publishable_ROrHu97hk6nLIIEFWDFTIA_llXAy4YL';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
            const { data: d2, error: e2 } = await _supabase.auth.signUp({ email, password });
            if (e2) alert(e2.message); else enterApp(d2.user);
        } else enterApp(data.user);
    }

    function enterApp(user) {
        currentUser = user;
        document.getElementById('auth-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        loadFeed();
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active-page');
        el.classList.add('active');
        if(id === 'home' || id === 'video') loadFeed();
    }

    async function uploadPost() {
        const txt = document.getElementById('postTxt').value;
        const file = document.getElementById('postFile').files[0];
        let mediaUrl = null, type = null;
        if (file) {
            const fName = Date.now() + "_" + file.name;
            type = file.type.split('/')[0];
            const { data } = await _supabase.storage.from('post-media').upload(fName, file);
            if (data) mediaUrl = _supabase.storage.from('post-media').getPublicUrl(fName).data.publicUrl;
        }
        await _supabase.from('posts').insert([{ content: txt, user_name: currentUser.email, media_url: mediaUrl, file_type: type }]);
        document.getElementById('postTxt').value = ""; loadFeed();
    }

    async function loadFeed() {
        const { data } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
        const cont = document.getElementById('feed-container');
        cont.innerHTML = data.map(p => `
            <div class="card">
                <b>@${p.user_name.split('@')[0]}</b>
                <p>${p.content}</p>
                ${p.media_url ? (p.file_type === 'video' ? `<video src="${p.media_url}" controls class="post-media"></video>` : `<img src="${p.media_url}" class="post-media">`) : ''}
                <div class="post-actions">
                    <div class="action-btn" onclick="likePost(${p.id})"><i class="fa fa-thumbs-up"></i> Like</div>
                    <div class="action-btn"><i class="fa fa-comment"></i> Comment</div>
                </div>
            </div>
        `).join('');
    }

    async function sendMsg() {
        const msg = document.getElementById('chatMsg').value;
        const target = document.getElementById('targetUser').value;
        if(!msg || !target) return;
        await _supabase.from('messages').insert([{ sender: currentUser.email, receiver: target, message: msg }]);
        document.getElementById('chatMsg').value = "";
        loadMessages();
    }
</script>
</body>
</html>
