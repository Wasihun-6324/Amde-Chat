<script type="module">
  // 1. Firebase አገልግሎቶችን ማስገባት
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  // 2. ያንተ Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBsPeWeVmHxcsiUgkSNZQ7VGurBb9_Wqm0",
    authDomain: "amde-chat.firebaseapp.com",
    projectId: "amde-chat",
    storageBucket: "amde-chat.firebasestorage.app",
    messagingSenderId: "266313399285",
    appId: "1:266313399285:web:4004cd738664d1aa77bebc"
  };

  // 3. Firebase-ን ማስጀመር
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- 4. የመግቢያ እና የምዝገባ ተግባራት ---
  
  // ለምዝገባ (Signup)
  window.registerUser = async () => {
    const email = document.getElementById('signup-email').value;
    const pass = document.getElementById('signup-password').value;
    if(!email || !pass) return alert("እባክዎ መረጃዎችን ይሙሉ");
    try {
      await createUserWithEmailAndPassword(auth, email, pass);
      alert("ምዝገባው ተሳክቷል!");
    } catch (e) { alert("ስህተት: " + e.message); }
  };

  // ለመግባት (Login)
  window.loginUser = async () => {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-password').value;
    if(!email || !pass) return alert("እባክዎ መረጃዎችን ይሙሉ");
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) { alert("የመግቢያ ስህተት: " + e.message); }
  };

  // የተጠቃሚውን ሁኔታ መከታተል (Login ካደረገ ገጹን ይቀይራል)
  onAuthStateChanged(auth, (user) => {
    const authPage = document.getElementById('auth-page');
    const mainApp = document.getElementById('main-app');
    if (user) {
      if(authPage) authPage.style.display = 'none';
      if(mainApp) mainApp.style.display = 'block';
      loadMessages(); // መልዕክቶችን ጫን
    } else {
      if(authPage) authPage.style.display = 'flex';
      if(mainApp) mainApp.style.display = 'none';
    }
  });

  // --- 5. የመልዕክት መላላኪያ (Chat Logic) ---

  // መልዕክት ለመላክ
  window.sendMessage = async () => {
    const input = document.getElementById('chatIn');
    const text = input.value.trim();
    if (text !== "" && auth.currentUser) {
      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          user: auth.currentUser.email,
          uid: auth.currentUser.uid,
          time: serverTimestamp()
        });
        input.value = "";
      } catch (e) { console.error("Error: ", e); }
    }
  };

  // መልዕክቶችን በሪል-ታይም መጫን
  function loadMessages() {
    const msgBox = document.getElementById('msgBox');
    if(!msgBox) return;
    
    const q = query(collection(db, "messages"), orderBy("time", "asc"));
    onSnapshot(q, (snapshot) => {
      msgBox.innerHTML = "";
      snapshot.forEach((doc) => {
        const d = doc.data();
        const isMine = d.uid === auth.currentUser.uid;
        const bubble = document.createElement('div');
        bubble.className = isMine ? "bubble right" : "bubble left";
        bubble.innerText = d.text;
        msgBox.appendChild(bubble);
      });
      msgBox.scrollTop = msgBox.scrollHeight;
    });
  }
</script>
